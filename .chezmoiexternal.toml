# Herdr app mods, pinned to upstream commits.
# Update: bump the commit SHA in url, then `chezmoi apply`.

# https://github.com/thuanlm215/herdr-float-space
[".config/herdr-app/mods/float-space"]
type = "archive"
url = "https://github.com/thuanlm215/herdr-float-space/archive/9cf49835d7a5593d13e10a9c97cb46c83a2bc63e.tar.gz"
stripComponents = 3
include = ["*/mods/float-space/**"]

# https://github.com/CacaoRick/herdr-open-vscode
[".config/herdr-app/mods/open-vscode"]
type = "archive"
url = "https://github.com/CacaoRick/herdr-open-vscode/archive/a1a36932823a2d71249f4af162cec4178a840c64.tar.gz"
stripComponents = 3
include = ["*/mods/open-vscode/**"]


# https://github.com/dmazlum/herdr-revive
[".config/herdr-app/mods/revive"]
